<title>Қарор слайдлари 03–09</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"><style id="st">
/* Taqdimot uslubi: 1526×860 slayd, to'q ko'k sarlavha + havorang chiziq,
   och ko'k chegarali panellar, ko'k→yashil gradient bo'lim nomlari, to'la ko'k ikonkalar. */
:root{
  --navy:#17254A; --cyan:#2FC1FF;
  --blue:#026DD1; --blue-2:#1F6DC4; --blue-ink:#0154BA; --chev:#519BFB;
  --teal:#05BAB6; --teal-2:#27A9AE;
  --line:#C9DEF3; --line-2:#B6E3F9;
  --card:#F4FAFE; --ink:#0E0E0E; --ink-2:#333B48; --ink-3:#5E6B7D;
  --page:#E9EEF5; --page-ink:#17254A;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page:#0E1626;--page-ink:#DCE6F5}
}
:root[data-theme="dark"]{--page:#0E1626;--page-ink:#DCE6F5}
*{box-sizing:border-box}








/* ---------- slide ---------- */
.slide{width:1526px;height:860px;background:#fff;transform-origin:top left;display:flex;flex-direction:column;color:var(--ink);overflow:hidden}
.sh{height:51px;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 28px;flex:none}
.sh h2{margin:0;color:#fff;font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.01em}
.sh .pg{color:#fff;font-weight:300;font-size:34px;letter-spacing:.02em;line-height:1}
.rule{height:5px;background:var(--cyan);flex:none}
.body{flex:1;min-height:0;padding:30px 24px 18px;display:flex;flex-direction:column;gap:30px}

/* ---------- panels ---------- */
.panel{position:relative;border:2px solid var(--line);border-radius:18px;padding:26px 16px 16px;display:flex;flex-direction:column;min-height:0;background:#fff}
.pt{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:#fff;padding:0 14px;white-space:nowrap;
  font-weight:800;font-size:16px;line-height:22px;text-transform:uppercase;color:#000;letter-spacing:.01em}
.pt.gr{font-size:20px;top:-16px;line-height:28px}
.pt.gr span{background:linear-gradient(90deg,#1F6DC4 0%,#2198B4 55%,#27A9AE 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;gap:14px;min-height:0}
.row>*{min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
.f1{flex:1}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:center;min-width:0}
.card.bd{background:#fff;border:1.5px solid var(--line-2)}
.card h4{margin:0 0 4px;font-weight:700;font-size:14.5px;line-height:1.25;color:var(--ink)}
.card p{margin:0;font-weight:500;font-size:12.5px;line-height:1.38;color:var(--ink-2)}
.card p b{font-weight:700;color:var(--ink)}
.ic{flex:none;color:var(--blue);font-size:34px;width:46px;text-align:center;line-height:1}
.ic.lg{font-size:46px;width:64px}
.ic.sm{font-size:26px;width:34px}
.big{font-weight:800;color:var(--blue-ink);line-height:1;letter-spacing:-.01em}
.tl{height:2px;background:var(--teal);border:0;margin:8px 0 9px;width:100%}

/* chevron flow */
.flow{display:flex;align-items:stretch;gap:0;min-height:0}
.flow>.step{flex:1;min-width:0}
.chev{flex:none;width:30px;display:grid;place-items:center;color:var(--chev);font-size:22px}
.step{position:relative;background:var(--card);border-radius:12px;padding:18px 14px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.step.bd{background:#fff;border:1.5px solid var(--line-2)}
.step .ic{width:auto;font-size:38px;margin-top:4px}
.step h4{margin:0;font-weight:700;font-size:14px;line-height:1.28;color:var(--ink)}
.step p{margin:0;font-weight:500;font-size:12px;line-height:1.4;color:var(--ink-2)}
.step p b{font-weight:700;color:var(--ink)}
.num{position:absolute;top:0;left:0;background:var(--blue-2);color:#fff;font-weight:300;font-size:19px;line-height:1;
  padding:7px 9px 6px;border-radius:12px 0 10px 0}

/* pills (2-слайддаги сана туглари) */
.pill{display:inline-flex;align-items:center;gap:9px;background:var(--blue-2);color:#fff;border-radius:8px;padding:7px 14px;font-weight:700;font-size:13.5px;white-space:nowrap}
.pill i{font-size:16px}
.check{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px;color:var(--ink)}
.check i{color:var(--blue-2);font-size:17px}

/* target bar (4-слайд пастидаги) */
.goal{flex:none;display:flex;height:54px;border-radius:10px;overflow:hidden}
.goal .gl{flex:none;width:300px;background:linear-gradient(90deg,#E4F4F1,#DBE9F7);display:flex;align-items:center;padding-left:28px;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%);
  font-weight:800;font-size:15px;color:var(--blue-ink);text-transform:uppercase}
.goal .gr{flex:1;margin-left:-6px;background:var(--card);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:500;font-size:15.5px;color:var(--blue-ink);
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%,18px 50%)}
.goal .gr b{font-weight:800;text-transform:uppercase}
.goal .gr i{font-size:22px}

/* donut */
.donut{position:relative;width:150px;height:150px;flex:none}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.lg-row{display:flex;gap:12px;align-items:flex-start}
.lg-row .dot{flex:none;width:14px;height:14px;border-radius:50%;margin-top:4px}

/* tree (3-слайддаги институт тузилмаси) */
.org{background:linear-gradient(90deg,#3F8DF0,#5B9EF2);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:18px;padding:12px 20px;
  font-weight:800;font-size:19px;line-height:1.2;text-transform:uppercase;letter-spacing:.01em}
.org i{font-size:40px}
.branch{position:relative;height:24px}
.branch::before{content:"";position:absolute;left:50%;top:0;width:2px;height:12px;background:#B9D3EC}
.branch::after{content:"";position:absolute;left:16.66%;right:16.66%;top:12px;height:18px;border:2px solid #B9D3EC;border-bottom:0;border-radius:8px 8px 0 0}
.branch span{position:absolute;left:50%;top:12px;width:2px;height:18px;background:#B9D3EC}
.leaves{display:flex;gap:14px}
.leaf{flex:1;text-align:center;padding:11px 6px 10px;position:relative;display:flex;flex-direction:column;align-items:center;gap:5px}
.leaf::before,.leaf::after{content:"";position:absolute;left:8px;right:8px;height:4px;border-radius:2px}
.leaf::before{top:0;background:linear-gradient(90deg,#2E7BD8 0 22%,transparent 22% 78%,#2E7BD8 78%)}
.leaf::after{bottom:0;background:#2E7BD8}
.leaf.t::before{background:linear-gradient(90deg,var(--teal-2) 0 22%,transparent 22% 78%,var(--teal-2) 78%)}
.leaf.t::after{background:var(--teal-2)}
.leaf i{font-size:30px;color:var(--blue)}
.leaf b{font-weight:800;font-size:16px;color:var(--ink);line-height:1.1}
.leaf span{font-weight:500;font-size:12.5px;color:var(--ink-2);line-height:1.3}

/* annex grid */
.ann{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ax{display:flex;align-items:stretch;background:var(--card);border-radius:10px;overflow:hidden;min-height:58px}
.ax .n{flex:none;width:46px;background:var(--blue-2);color:#fff;font-weight:300;font-size:22px;display:grid;place-items:center}
.ax .n.new{background:var(--teal-2)}
.ax p{margin:0;padding:8px 12px;display:flex;align-items:center;font-weight:600;font-size:12.5px;line-height:1.3;color:var(--ink)}
/* v2 qo'shimchalari */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;background:#E8F1FC;color:var(--blue-2);font-weight:700;font-size:12.5px;line-height:1.2;padding:7px 13px;border-radius:16px}
.chip i{font-size:13px}
.kick{font-weight:800;font-size:12px;line-height:1.3;color:var(--blue-2);text-transform:uppercase;letter-spacing:.01em}
.mas{font-weight:500;font-size:11.5px;line-height:1.4;color:var(--ink-3)}
.mas b{font-weight:700;color:var(--ink)}
.sub{font-weight:800;font-size:12.5px;color:var(--ink);text-transform:uppercase}
.brk{display:flex;align-items:center;gap:10px}
.brk .amt{flex:none;width:62px;font-weight:800;font-size:16px;color:var(--blue-ink);text-align:right}
.brk .bw{flex:none;width:96px;height:12px;background:#E3EEF9;border-radius:6px;overflow:hidden;display:flex}
.brk .bf{height:12px;background:var(--blue-2);border-radius:6px}
.brk .bf.t{background:var(--teal-2)}
.brk p{margin:0;font-weight:600;font-size:12px;line-height:1.3;color:var(--ink)}
.tier{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;flex:1}
.tier .col-bar{width:100%;border-radius:10px 10px 0 0;background:var(--blue-2);display:flex;align-items:flex-start;justify-content:center;padding-top:10px}
.tier .col-bar span{color:#fff;font-weight:800;font-size:22px;line-height:1}
.tier .lab2{font-weight:600;font-size:12.5px;color:var(--ink-2);text-align:center;line-height:1.3}
.stat-r{display:flex;align-items:center;gap:12px}
.stat-r .v{flex:none;font-weight:800;font-size:22px;color:#C0392B;line-height:1}
.stat-r p{margin:0;font-weight:500;font-size:12.5px;line-height:1.35;color:var(--ink-2)}
.redcard{background:#FDF3F2;border-radius:12px;padding:14px 16px}
.goalcard{background:var(--card);border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:center}
.goalcard .big{font-size:26px}
.person{display:flex;flex-direction:column;gap:2px}
.person b{font-weight:800;font-size:14px;color:var(--ink)}
.person span{font-weight:500;font-size:12px;line-height:1.35;color:var(--ink-2)}
.ann7{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ax.hl .n{background:var(--teal-2)}

/* Қўшимча маблағ панели */
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px}
.stack span{display:grid;place-items:center;color:#fff;font-weight:800;font-size:11.5px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
.legend .li{display:flex;gap:7px;align-items:flex-start}
.legend .dot{flex:none;width:10px;height:10px;border-radius:3px;margin-top:3px}
.legend p{margin:0;font-weight:500;font-size:11.5px;line-height:1.3;color:var(--ink-2)}
.legend p b{font-weight:800;color:var(--ink)}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ki{display:flex;gap:7px;align-items:center;font-weight:500;font-size:11px;line-height:1.3;color:var(--ink-2)}
.ki i{flex:none;color:var(--blue);font-size:18px}
.ki b{font-weight:700;color:var(--ink)}
/* Sahifa: yopishqoq asboblar paneli, ostida slaydlar ustma-ust; slayd 1526×860 kenglikka moslab kichraytiriladi. */
:root{--page:#E9EEF5;--page-ink:#17254A;--muted:#5E6B7D;--edit:#E0920F;--edit-bg:rgba(224,146,15,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0E1626;--page-ink:#DCE6F5;--muted:#9AA9BF;--edit:#F2B24A;--edit-bg:rgba(242,178,74,.12);color-scheme:dark}}
:root[data-theme="dark"]{--page:#0E1626;--page-ink:#DCE6F5;--muted:#9AA9BF;--edit:#F2B24A;--edit-bg:rgba(242,178,74,.12);color-scheme:dark}
body{background:var(--page);color:var(--page-ink);font-family:'Montserrat',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:#17254A}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:#17254A;color:#fff;border-bottom:3px solid #2FC1FF;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1526px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.bar h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em;min-width:0}
.bar .st{font-size:12px;color:#A9C4E4;font-weight:500;min-width:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.tb{font:600 12.5px 'Montserrat',system-ui,sans-serif;border-radius:7px;padding:7px 13px;cursor:pointer;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff}
.tb:hover{background:rgba(255,255,255,.16)}
.tb:focus-visible{outline:2px solid #2FC1FF;outline-offset:2px}
.tb[aria-pressed="true"]{background:#2FC1FF;border-color:#2FC1FF;color:#0B1D33}
.tb.pri{background:#2FC1FF;border-color:#2FC1FF;color:#0B1D33}
.tb:disabled{opacity:.45;cursor:default}
.tb.sm{padding:5px 11px;font-size:12px;border-color:var(--muted);background:transparent;color:var(--page-ink)}
.tb.sm:hover{background:rgba(127,140,160,.15)}
.help{max-width:1526px;margin:12px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12.5px;color:var(--muted);line-height:1.5}
#slides{max-width:1526px;margin:0 auto;padding-block:4px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sw{margin-top:18px}
.cap{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 8px;font-weight:700;font-size:13px;letter-spacing:.02em}
.cap span{min-width:0}
.stage{width:100%;overflow:hidden;border-radius:6px;box-shadow:0 2px 16px rgba(10,30,60,.18);background:#fff}
i[class*="fa-"]{font-style:normal;display:inline-block;line-height:1}
i[class*="fa-"] svg{height:1em;width:auto;display:inline-block;vertical-align:-.125em;fill:currentColor}
body.editing [data-k]{outline:1px dashed transparent;outline-offset:2px;border-radius:3px;cursor:text}
body.editing [data-k]:hover{outline-color:var(--edit)}
body.editing [data-k]:focus{outline:2px solid var(--edit);background:var(--edit-bg)}
body.export .bar,body.export .help,body.export .cap{display:none}
body.export #slides{padding:0;max-width:none}
body.export .sw{margin:0}
body.export .stage{border-radius:0;box-shadow:none;width:1526px}
@media (max-width:640px){.bar h1{font-size:13.5px}.cap{font-size:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

ne;width:12px;height:12px;border-radius:50%;background:#1F6DC4;margin-top:3px\"><\/span><div style=\"flex:1;width:2px;background:var(--line)\"><\/div><\/div><p style=\"margin:0;flex:1;font-weight:500;font-size:13px;line-height:1.38;color:var(--ink-2)\">Мактаблар учун Интернет тарифлари қайта кўрилади<\/p><\/div><div style=\"flex:1;display:flex;gap:12px;min-height:0\"><div style=\"flex:none;width:80px;text-align:right;font-weight:800;font-size:14px;color:#1F6DC4;padding-top:1px\">1.03.2027<\/div><div style=\"flex:none;width:14px;display:flex;flex-direction:column;align-items:center\"><span style=\"flex:none;width:12px;height:12px;border-radius:50%;background:#1F6DC4;margin-top:3px\"><\/span><div style=\"flex:1;width:2px;background:var(--line)\"><\/div><\/div><p style=\"margin:0;flex:1;font-weight:500;font-size:13px;line-height:1.38;color:var(--ink-2)\">Миллий модель · ноутбук ташаббуси · KOICA ер ва бино · олимпиадалар тартиби<\/p><\/div><div style=\"flex:1;display:flex;gap:12px;min-height:0\"><div style=\"flex:none;width:80px;text-align:right;font-weight:800;font-size:14px;color:#1F6DC4;padding-top:1px\">1.04.2027<\/div><div style=\"flex:none;width:14px;display:flex;flex-direction:column;align-items:center\"><span style=\"flex:none;width:12px;height:12px;border-radius:50%;background:#1F6DC4;margin-top:3px\"><\/span><div style=\"flex:1;width:2px;background:var(--line)\"><\/div><\/div><p style=\"margin:0;flex:1;font-weight:500;font-size:13px;line-height:1.38;color:var(--ink-2)\">Миллий рамка · нодавлат менторларни қўллаб-қувватлаш дастури<\/p><\/div><div style=\"flex:1;display:flex;gap:12px;min-height:0\"><div style=\"flex:none;width:80px;text-align:right;font-weight:800;font-size:14px;color:#27A9AE;padding-top:1px\">2027/2028<\/div><div style=\"flex:none;width:14px;display:flex;flex-direction:column;align-items:center\"><span style=\"flex:none;width:12px;height:12px;border-radius:50%;background:#27A9AE;margin-top:3px\"><\/span><div style=\"flex:1\"><\/div><\/div><p style=\"margin:0;flex:1;font-weight:500;font-size:13px;line-height:1.38;color:var(--ink-2)\">Сертификатлаш · 4/8 соат СИ · ОТМ модуллари · ваучер ва стартаплар<\/p><\/div><\/div><\/div><div class=\"panel\" style=\"flex:1;padding:24px 14px 12px\"> <div class=\"pt\">Ижро ва назорат<\/div><div class=\"col f1\" style=\"gap:0\"><div class=\"card bd\" style=\"flex:1.45;flex-direction:column;align-items:stretch;gap:6px;padding:10px 14px\"><div class=\"kick\">Шахсий масъул ва жавобгар<\/div><div style=\"flex:1;display:flex;align-items:center;gap:12px\"><span style=\"flex:none;width:36px;height:36px;border-radius:50%;background:#E8F1FC;display:grid;place-items:center;font-weight:800;font-size:13px;color:#1F6DC4\">ЭТ<\/span><div class=\"person\"><b>Э.О. Турдимов<\/b><span>Бош вазирнинг биринчи ўринбосари — таълим ва илм-фан вазири<\/span><\/div><\/div><div style=\"flex:1;display:flex;align-items:center;gap:12px\"><span style=\"flex:none;width:36px;height:36px;border-radius:50%;background:#E8F1FC;display:grid;place-items:center;font-weight:800;font-size:13px;color:#1F6DC4\">ШШ<\/span><div class=\"person\"><b>Ш.Х. Шерматов<\/b><span>Рақамли технологиялар вазири<\/span><\/div><\/div><div style=\"flex:1;display:flex;align-items:center;gap:12px\"><span style=\"flex:none;width:36px;height:36px;border-radius:50%;background:#E8F1FC;display:grid;place-items:center;font-weight:800;font-size:13px;color:#1F6DC4\">ШК<\/span><div class=\"person\"><b>Ш.К. Курбаниязов<\/b><span>Таълимни ривожлантириш республика илмий-методик маркази директори<\/span><\/div><\/div><\/div><div class=\"card\" style=\"flex:1;flex-direction:column;align-items:stretch;gap:6px;padding:10px 14px;margin-top:9px\"><div class=\"kick\" style=\"color:var(--teal-2)\">Назорат<\/div><div style=\"flex:1;display:flex;align-items:center;gap:12px\"><span style=\"flex:none;width:36px;height:36px;border-radius:50%;background:#DFF3F2;display:grid;place-items:center;font-weight:800;font-size:13px;color:#1C8F93\">АА<\/span><div class=\"person\"><b>А.Н. Арипов<\/b><span>Бош вазир<\/span><\/div><\/div><div style=\"flex:1;display:flex;align-items:center;gap:12px\"><span style=\"flex:none;width:36px;height:36px;border-radius:50%;background:#DFF3F2;display:grid;place-items:center;font-weight:800;font-size:13px;color:#1C8F93\">ОХ<\/span><div class=\"person\"><b>О.А. Хакимов<\/b><span>Президент Администрацияси Раҳбарининг таълимни ислоҳ қилиш бўйича ўринбосари<\/span><\/div><\/div><\/div><\/div><\/div><\/div> <\/div>\n<\/div>"}]}</script><script type="text/plain" id="reset">:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</script><script type="text/plain" id="pagehead"><title>Қарор слайдлари 03–09<\/title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"></script><script type="text/plain" id="shell"><header class="bar"><div class="bar-in"><h1>Таълимда СИ · қарор слайдлари 03–09<\/h1><span class="st" id="status" role="status"><\/span><div class="tools"><button type="button" class="tb" id="bCancel" hidden>Бекор қилиш<\/button><button type="button" class="tb" id="bEdit" aria-pressed="false">Таҳрирлаш<\/button><button type="button" class="tb pri" id="bSave" disabled>Сақлаш<\/button><\/div><\/div><\/header><p class="help">Матнни ўзгартириш: <b>Таҳрирлаш<\/b> → керакли ёзувни босиб ёзинг → <b>Сақлаш<\/b>. Изоҳ: слайд устидаги <b>Изоҳ қолдириш<\/b> тугмаси ёки изоҳ режимида керакли жойни белгиланг — Claude’га юборилган изоҳлар бўйича тузатиш киритилади.<\/p><main id="slides"><\/main></script><script id="app">(function(){
  var W=1526,H=860;
  var deckEl=document.getElementById('deck');
  var DECK=JSON.parse(deckEl.textContent);
  var root=document.getElementById('slides');
  var bar=document.getElementById('bar');
  var bEdit=document.getElementById('bEdit'),bSave=document.getElementById('bSave'),bCancel=document.getElementById('bCancel'),status=document.getElementById('status');
  var edits={};var editing=false;var art=null;var cmt=null;var readOnly=false;

  if(location.hash==='#export')document.body.classList.add('export');

  function blocks(rootEl){
    var out=[];
    (function walk(el){
      var t=el.tagName.toLowerCase();
      if(t==='i'||t==='svg')return;
      for(var i=0;i<el.childNodes.length;i++){var n=el.childNodes[i];if(n.nodeType===3&&/\S/.test(n.textContent)){out.push(el);return;}}
      for(var j=0;j<el.children.length;j++)walk(el.children[j]);
    })(rootEl);
    return out;
  }
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function clean(el){
    var out='';
    el.childNodes.forEach(function(n){
      if(n.nodeType===3){out+=esc(n.textContent);return;}
      if(n.nodeType!==1)return;
      var t=n.tagName.toLowerCase();
      if(t==='br'){out+='<br>';return;}
      var inner=clean(n);
      if(t==='b'||t==='strong'||t==='span'){
        var tag=t==='strong'?'b':t;var st=n.getAttribute('style');
        out+='<'+tag+(st?' style="'+st.replace(/"/g,'&quot;')+'"':'')+'>'+inner+'</'+tag+'>';
      }else if(t==='div'||t==='p'){out+=(out?'<br>':'')+inner;}
      else out+=inner;
    });
    return out;
  }
  function textOf(html){return html.replace(/<br>/g,' ').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ');}

  function src(id){return document.getElementById(id).textContent.replace(/<\\\//g,'</');}
  function caption(slide){var h=slide.querySelector('.sh h2'),p=slide.querySelector('.sh .pg');return (p?p.textContent+' · ':'')+(h?h.textContent:'');}

  function render(){
    root.textContent='';
    DECK.slides.forEach(function(s){
      var sec=document.createElement('section');sec.className='sw';
      var cap=document.createElement('div');cap.className='cap';
      var lab=document.createElement('span');cap.appendChild(lab);
      var cb=document.createElement('button');cb.type='button';cb.className='tb sm cbtn';cb.textContent='Изоҳ қолдириш';cb.hidden=!cmt;
      cap.appendChild(cb);
      var stage=document.createElement('div');stage.className='stage';
      stage.innerHTML=s.html;
      var slide=stage.firstElementChild;
      lab.textContent=caption(slide);
      cb.addEventListener('click',function(){if(!cmt)return;cmt.openComposer({element:slide}).catch(function(e){if(e&&e.code==='unavailable'){cmt=null;document.querySelectorAll('.cbtn').forEach(function(b){b.hidden=true;});}});});
      blocks(slide).forEach(function(el,i){
        var key=s.id+':'+i;el.setAttribute('data-k',key);
        if(edits[key]!=null)el.innerHTML=edits[key];
      });
      sec.appendChild(cap);sec.appendChild(stage);root.appendChild(sec);
    });
    setEditable(editing);fit();
  }
  function setEditable(on){
    root.querySelectorAll('[data-k]').forEach(function(el){if(on)el.setAttribute('contenteditable','true');else el.removeAttribute('contenteditable');});
  }
  function fit(){
    root.querySelectorAll('.stage').forEach(function(st){
      var sl=st.firstElementChild;var s=document.body.classList.contains('export')?1:st.clientWidth/W;
      sl.style.transform='scale('+s+')';st.style.height=(H*s)+'px';
    });
  }
  function count(){return Object.keys(edits).length;}
  function refresh(){
    var n=count();
    bEdit.textContent=editing?'Таҳрирни якунлаш':'Таҳрирлаш';
    bEdit.setAttribute('aria-pressed',String(editing));
    bSave.disabled=!n||readOnly;bCancel.hidden=!n;
    document.body.classList.toggle('editing',editing);
    if(readOnly)status.textContent='Фақат кўриш режими — сақлаш ҳуқуқи йўқ';
    else if(n)status.textContent=n+' та ўзгариш сақланмаган';
    else status.textContent=editing?'Матнни босиб ўзгартиринг':'';
  }

  root.addEventListener('input',function(e){
    var el=e.target.closest&&e.target.closest('[data-k]');if(!el)return;
    var h=clean(el);if(!/\S/.test(textOf(h)))h='​';
    edits[el.getAttribute('data-k')]=h;refresh();
  });
  root.addEventListener('keydown',function(e){
    if(!editing)return;
    if(e.key==='Enter'){e.preventDefault();document.execCommand('insertLineBreak');}
    if(e.key==='Escape'&&document.activeElement)document.activeElement.blur();
  });
  root.addEventListener('paste',function(e){
    if(!editing)return;e.preventDefault();
    var t=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t);
  });
  bEdit.addEventListener('click',function(){editing=!editing;setEditable(editing);refresh();});
  bCancel.addEventListener('click',function(){edits={};render();refresh();});

  function buildDoc(){
    var slides=DECK.slides.map(function(s){
      var d=new DOMParser().parseFromString('<!doctype html><body>'+s.html+'</body>','text/html');
      var sl=d.body.firstElementChild;
      blocks(sl).forEach(function(el,i){var k=s.id+':'+i;if(edits[k]!=null)el.innerHTML=edits[k];});
      return {id:s.id,html:sl.outerHTML};
    });
    var json=JSON.stringify({slides:slides}).replace(/<\//g,'<\\/');
    var head='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+document.getElementById('reset').textContent+'</style></head><body>';
    return head+src('pagehead')
      +'<style id="st">'+document.getElementById('st').textContent+'</style>'
      +src('shell')
      +'<script type="application/json" id="deck">'+json+'<\/script>'
      +'<script type="text/plain" id="reset">'+document.getElementById('reset').textContent+'<\/script>'
      +'<script type="text/plain" id="pagehead">'+src('pagehead').replace(/<\//g,'<\\/')+'<\/script>'
      +'<script type="text/plain" id="shell">'+src('shell').replace(/<\//g,'<\\/')+'<\/script>'
      +'<script id="app">'+document.getElementById('app').textContent+'<\/script></body></html>';
  }
  bSave.addEventListener('click',function(){
    if(!art||!count())return;
    bSave.disabled=true;status.textContent='Сақланмоқда…';
    art.publish(buildDoc()).then(function(){status.textContent='Сақланди';}).catch(function(e){
      var c=e&&e.code;
      if(c==='conflict'){status.textContent='Бошқа версия сақланган — саҳифа янгиланади';return;}
      if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='not_declared'){readOnly=true;refresh();return;}
      status.textContent='Сақлаб бўлмади ('+(c||'хато')+'). Қайта уриниб кўринг.';bSave.disabled=false;
    });
  });

  render();refresh();
  window.addEventListener('resize',fit);
  if(window.ResizeObserver)new ResizeObserver(fit).observe(root);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

  if(window.claude&&window.claude.use){
    window.claude.use('artifact').then(function(a){art=a;if(!a){bSave.hidden=true;bEdit.hidden=true;}}).catch(function(){});
    window.claude.use('comments').then(function(c){cmt=c;document.querySelectorAll('.cbtn').forEach(function(b){b.hidden=!c;});}).catch(function(){});
  }else{bSave.hidden=true;}
})();
</script>
