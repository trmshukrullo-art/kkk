.tile{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.chev{color:#B4C0D4;flex:none}

.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:51;border-radius:47px;background:var(--card);padding:6px 16px 24px;box-shadow:0 -10px 40px rgba(2,8,26,.16)}

.num{width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--acc-ink);font-family:Inter;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
