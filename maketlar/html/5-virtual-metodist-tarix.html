<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual metodist — Chat tarixi</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{
  --bg:#EEF3FA;--surface:#fff;--surface-2:#F4F7FC;--line:#E3EAF4;--line-2:#EDF1F7;
  --text:#0F1A2C;--text-2:#4B5A70;--muted:#8A96A9;
  --pri:#0D5FB0;--pri-2:#1273C9;--pri-50:#E8F1FB;--pri-100:#D3E5F8;
  --side-1:#0F6CC4;--side-2:#0B57A8;
  --danger:#E5484D;
  --bot:linear-gradient(135deg,#1FD0A0 0%,#1AA9C8 45%,#1673D6 100%);
  --shadow:0 1px 2px rgba(16,40,80,.04),0 6px 20px rgba(16,40,80,.05);
  --pop:0 14px 36px rgba(16,40,80,.16);
}
:root[data-theme="dark"]{
  --bg:#0A111E;--surface:#111A2A;--surface-2:#172337;--line:#1F2C43;--line-2:#1A263B;
  --text:#E6ECF6;--text-2:#B2BED1;--muted:#7C8AA2;
  --pri:#2F8BE6;--pri-2:#3A97EC;--pri-50:#13284A;--pri-100:#1A3560;
  --side-1:#0E2A52;--side-2:#091C38;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --pop:0 14px 36px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{flex:none}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}.ic.xs{width:14px;height:14px}

/* ---------- shell ---------- */
.app{display:flex;height:100vh}
.side{width:270px;background:linear-gradient(180deg,var(--side-1),var(--side-2));color:#fff;padding:26px 18px 22px;display:flex;flex-direction:column;flex:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 24px;border-bottom:1px solid rgba(255,255,255,.14)}
.brand .mark{width:46px;height:46px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.brand b{font-size:15px;line-height:18px;font-weight:600}
.nav{margin-top:20px;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:14px;height:46px;padding:0 14px;border-radius:12px;color:rgba(255,255,255,.92);text-decoration:none;font-size:15.5px;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:rgba(255,255,255,.16);color:#fff}
.logout{margin-top:auto;display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:12px;background:rgba(255,255,255,.08);color:#FF8F8F;font-weight:500;font-size:15px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:16px 20px 18px;gap:16px}
.topbar{height:64px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:0 14px 0 14px;flex:none}
.topbar h1{font-size:18px;font-weight:600}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.who{text-align:right;margin-right:2px}
.who b{display:block;font-size:14px;font-weight:600}
.who span{font-size:12px;color:var(--muted)}
.ava{width:40px;height:40px;border-radius:50%;background:#2E7BF0;color:#fff;display:grid;place-items:center;font-weight:600;font-size:15px;flex:none}
.tb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2)}
.flag{width:20px;height:14px;border-radius:3px;background:linear-gradient(180deg,#0099B5 0 33%,#fff 33% 38%,#CE1126 38% 42%,#fff 42% 58%,#CE1126 58% 62%,#fff 62% 67%,#1EB53A 67%)}
.theme{display:flex;background:var(--surface-2);border-radius:100px;padding:3px}
.theme button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.theme button.on{background:var(--surface);color:var(--pri-2);box-shadow:var(--shadow)}
.hist-toggle{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text-2)}
.hist-toggle:hover{background:var(--surface-2);color:var(--text)}
.hist-toggle.on{background:var(--pri-50);color:var(--pri-2)}

.body{flex:1;min-height:0;display:flex;gap:16px}

/* ---------- history panel ---------- */
.hist{width:320px;flex:none;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transition:width .25s ease,opacity .2s,margin .25s}
.hist.closed{width:0;opacity:0;margin-right:-16px}
.hist-in{width:320px;display:flex;flex-direction:column;height:100%}
.h-hd{display:flex;align-items:center;gap:8px;padding:18px 16px 0 20px}
.h-hd h2{font-size:16px;font-weight:600}
.h-hd .cnt{font-size:12px;color:var(--muted);background:var(--surface-2);padding:2px 8px;border-radius:100px;font-weight:500}
.h-hd .x{margin-left:auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.h-hd .x:hover{background:var(--surface-2);color:var(--text)}
.h-tools{padding:14px 16px 0;display:flex;flex-direction:column;gap:10px}
.new{height:44px;border-radius:12px;background:var(--pri);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px rgba(13,95,176,.25);transition:.15s}
.new:hover{background:var(--pri-2)}
.new kbd{font:500 11px 'Inter';background:rgba(255,255,255,.18);border-radius:5px;padding:2px 6px}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:11px;background:var(--surface-2);color:var(--muted);border:1px solid transparent;transition:.15s}
.search:focus-within{border-color:var(--pri-100);background:var(--surface)}
.search input{border:0;background:none;outline:0;flex:1;font-size:13.5px;min-width:0}
.search .clr{display:none;color:var(--muted)}
.search.has .clr{display:grid}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 2px;margin-top:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:30px;padding:0 11px;border-radius:100px;border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--text-2);display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s}
.chip:hover{border-color:var(--pri-100)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip .d{width:7px;height:7px;border-radius:50%}
.list{flex:1;overflow:auto;padding:6px 10px 12px;margin-top:6px}
.list::-webkit-scrollbar{width:6px}.list::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.grp{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:14px 10px 6px}
.item{position:relative;display:flex;gap:11px;padding:10px 10px;border-radius:12px;cursor:pointer;transition:background .12s}
.item:hover{background:var(--surface-2)}
.item.on{background:var(--pri-50)}
.item .sic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.item .t{flex:1;min-width:0}
.item .r1{display:flex;align-items:center;gap:6px}
.item b{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.on b{color:var(--pri-2)}
.item time{font-size:11.5px;color:var(--muted);flex:none}
.item small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.item small .att{display:inline-flex;align-items:center;gap:3px;vertical-align:-2px}
.item .more{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:8px;display:none;place-items:center;color:var(--text-2);background:var(--surface);box-shadow:var(--shadow)}
.item:hover .more,.item .more.open{display:grid}
.item:hover time{visibility:hidden}
.item .pin{color:var(--muted)}
.item input.rn{width:100%;font-size:13.5px;font-weight:600;border:1px solid var(--pri-2);border-radius:7px;padding:2px 6px;outline:0;background:var(--surface)}
mark{background:#FFE48A;color:inherit;border-radius:3px;padding:0 1px}
:root[data-theme="dark"] mark{background:#6B5410}
.empty-l{padding:40px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}
.empty-l .ei{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 10px}
.h-ft{padding:12px 16px 14px;border-top:1px solid var(--line-2)}
.quota{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-bottom:6px}
.quota b{font-weight:600;color:var(--text)}
.bar{height:6px;background:var(--line-2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:36%;background:var(--bot);border-radius:6px}

.pop{position:fixed;z-index:50;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);padding:6px;display:none}
.pop.open{display:block}
.pop button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13.5px;text-align:left;color:var(--text)}
.pop button:hover{background:var(--surface-2)}
.pop button.del{color:var(--danger)}
.pop hr{border:0;border-top:1px solid var(--line-2);margin:4px 2px}

/* ---------- chat ---------- */
.chat{flex:1;min-width:0;display:flex;flex-direction:column}
.c-hd{display:flex;align-items:center;gap:10px;padding:2px 4px 10px;min-height:42px}
.c-hd h3{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-hd .right{margin-left:auto;display:flex;gap:4px}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--text-2)}
.ib:hover{background:var(--surface);color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:100px;background:var(--pri-50);color:var(--pri-2);font-size:12.5px;font-weight:500;white-space:nowrap}
.scroll{flex:1;overflow:auto;scroll-behavior:smooth;padding-right:4px}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.thread{display:flex;flex-direction:column;gap:22px;padding:4px 4px 24px;max-width:1240px;margin:0 auto}
.day{align-self:center;font-size:13px;font-weight:600;color:var(--text-2)}
.row{display:flex;gap:16px;align-items:flex-end}
.bot-ava{width:44px;height:44px;border-radius:50%;background:var(--bot);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(26,169,200,.25)}
.bmsg{background:var(--surface);border-radius:16px 16px 16px 4px;padding:16px 20px 18px;box-shadow:var(--shadow);max-width:min(1060px,100%)}
.bmsg .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;margin-bottom:10px}
.bmsg .nm time{margin-left:6px;font-size:12px;color:var(--muted);font-weight:400}
.bmsg p{font-size:15px;line-height:1.6}
.res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:16px}
.rc{border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px;display:flex;flex-direction:column;gap:4px;transition:.15s;background:var(--surface)}
.rc:hover{border-color:var(--pri-100);box-shadow:0 8px 22px rgba(16,40,80,.08);transform:translateY(-1px)}
.ft{width:40px;height:44px;position:relative;margin-bottom:10px}
.ft .pg{position:absolute;inset:0 4px 0 6px;border:1.5px solid #C9D3E1;border-radius:4px 10px 4px 4px;background:var(--surface)}
.ft .lb{position:absolute;left:0;bottom:8px;font-size:10px;font-weight:700;color:#fff;padding:1px 4px;border-radius:3px}
.ft.yt{width:48px;height:34px;border-radius:9px;background:#FF0000;display:grid;place-items:center;margin:5px 0 15px}
.rc b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc span{font-size:13px;color:var(--muted)}
.rc .open{align-self:flex-start;margin-top:10px;height:32px;padding:0 10px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text)}
.rc .open:hover{background:var(--pri-50);color:var(--pri-2)}
.acts{display:flex;gap:2px;margin-top:12px}
.acts button{height:30px;padding:0 8px;border-radius:8px;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.acts button:hover{background:var(--surface-2);color:var(--text)}
.row.me{justify-content:flex-end;align-items:flex-start}
.umsg{background:var(--pri);color:#fff;border-radius:16px 4px 16px 16px;padding:13px 18px;font-size:15px;line-height:1.5;max-width:min(900px,75%);white-space:pre-wrap;word-break:break-word}
.umsg+time{display:block}
.me .col{display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:0}
.me .col time{font-size:11.5px;color:var(--muted)}
.typing{background:var(--surface);border-radius:16px 16px 16px 4px;padding:16px 20px;box-shadow:var(--shadow);display:flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--text);animation:b 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sugg button{height:34px;padding:0 13px;border-radius:100px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.sugg button:hover{border-color:var(--pri-2);color:var(--pri-2);background:var(--pri-50)}

.composer{flex:none;padding-top:10px}
.cbox{display:flex;align-items:flex-end;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:10px 10px 10px 22px;transition:.15s}
.cbox:focus-within{border-color:#8AB6F0;box-shadow:0 0 0 4px var(--pri-50)}
.cbox textarea{flex:1;border:0;outline:0;resize:none;background:none;font-size:15.5px;line-height:1.5;padding:12px 0;max-height:160px}
.cbox textarea::placeholder{color:var(--muted)}
.att-b{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.att-b:hover{background:var(--surface-2);color:var(--text)}
.send{width:52px;height:52px;border-radius:50%;background:var(--pri-2);color:#fff;display:grid;place-items:center;transition:.15s;flex:none}
.send:disabled{background:#9DC2EC;cursor:default}
:root[data-theme="dark"] .send:disabled{background:#22406A}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#0F1A2C;color:#fff;padding:10px 10px 10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;display:flex;gap:14px;align-items:center;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#7CC0FF;font-weight:600;padding:4px 8px;border-radius:7px}
.toast button:hover{background:rgba(255,255,255,.08)}
.scrim{display:none}

@media (max-width:1400px){.res{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1180px){.side{width:84px}.side .brand b,.side .nav a span,.side .logout span{display:none}.nav a,.logout{justify-content:center;padding:0}.brand{justify-content:center;padding:0 0 22px}.who{display:none}}
@media (max-width:900px){
  .hist{position:fixed;left:0;top:0;bottom:0;z-index:40;border-radius:0 18px 18px 0;width:320px;margin:0;transform:translateX(0);transition:transform .25s}
  .hist.closed{width:320px;opacity:1;transform:translateX(-105%);margin:0}
  .scrim{display:block;position:fixed;inset:0;background:rgba(10,20,40,.35);z-index:35;opacity:0;pointer-events:none;transition:.2s}
  .scrim.on{opacity:1;pointer-events:auto}
}
@media (max-width:700px){.side{display:none}.main{padding:10px;gap:10px}.res{grid-template-columns:1fr}.bot-ava{width:34px;height:34px}.row{gap:10px}.flag,.tb{display:none}}
</style></head><body>

<script>
const SUBJ={
  fizika:{n:'Fizika',i:'i-atom',c:'#1673D6',bg:'#E6F0FC'},
  matem:{n:'Matematika',i:'i-calc',c:'#7C3AED',bg:'#F1EBFE'},
  ingliz:{n:'Ingliz tili',i:'i-lang',c:'#E8590C',bg:'#FDEFE6'},
  bio:{n:'Biologiya',i:'i-leaf',c:'#16A34A',bg:'#E7F7EC'},
  ona:{n:'Ona tili',i:'i-feather',c:'#DB2777',bg:'#FCE8F2'},
};
const H=36e5,D=24*H,now=Date.now();
const RES=[
  {k:'pdf',t:'Fizika fani qanday fan?',s:'Mavzuga oid resurslar'},
  {k:'yt',t:'Fizika tadqiqot metodlari',s:'YouTube'},
  {k:'ppt',t:"Fizika fanini o'rganish usullari",s:'Mavzuga oid resurslar'},
  {k:'doc',t:"Fizika fani nimani o'rgatadi",s:'Mavzuga oid resurslar'}];
let chats=[
  {id:1,s:'fizika',title:"Fizika fani haqida umumiy ma'lumot",t:now-25*60e3,pin:true,res:4,msgs:[
    {b:1,time:'09:12',day:'13 Noyabr',text:"Assalomu alaykum, Azizbek! Bugun siz bilan nimani o'rganamiz?"},
    {b:0,time:'09:13',text:"Salom, menga Fizika fani haqida umumiy ma'lumotlar kerak"},
    {b:1,time:'09:13',text:"Ajoyib! Unda men siz uchun fizika fani haqida kerakli barcha resurslarni yuboraman.",res:RES}]},
  {id:2,s:'matem',title:"Kvadrat tenglamalarni yechish",t:now-3*H,msgs:[],last:"Diskriminant formulasini tushuntirib ber"},
  {id:3,s:'ingliz',title:"Present Perfect qoidalari",t:now-D-2*H,res:2,msgs:[],last:"Misollar bilan tushuntir"},
  {id:4,s:'fizika',title:"Nyuton qonunlari",t:now-D-5*H,res:3,msgs:[],last:"Ikkinchi qonunga masala"},
  {id:5,s:'bio',title:"Hujayra tuzilishi",t:now-3*D,msgs:[],last:"O'simlik va hayvon hujayrasi farqi"},
  {id:6,s:'ona',title:"Ega va kesim",t:now-5*D,pin:true,msgs:[],last:"Gap bo'laklari bo'yicha test"},
  {id:7,s:'matem',title:"Kasrlarni qo'shish",t:now-9*D,msgs:[],last:"Har xil maxrajli kasrlar"},
  {id:8,s:'fizika',title:"Tovush to'lqinlari",t:now-16*D,res:1,msgs:[],last:"Aks-sado qanday hosil bo'ladi?"},
  {id:9,s:'ingliz',title:"Irregular verbs ro'yxati",t:now-24*D,msgs:[],last:"Eng ko'p ishlatiladigan 50 ta fe'l"},
];
let active=1,filter='all',q='',menuFor=null,undo=null,renaming=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl=s=>{s=esc(s);if(!q)return s;const i=s.toLowerCase().indexOf(q);return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+q.length)+'</mark>'+s.slice(i+q.length)};
const MON=['yan','fev','mar','apr','may','iyn','iyl','avg','sen','okt','noy','dek'];
function grp(t){const d=Math.floor((new Date().setHours(24,0,0,0)-t)/D);return d<1?'Bugun':d<2?'Kecha':d<7?'Shu hafta':d<30?"O'tgan oy":'Avvalroq'}
function stamp(t){const d=new Date(t),diff=Math.floor((new Date().setHours(24,0,0,0)-t)/D);
  if(diff<1)return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(diff<2)return 'Kecha';if(diff<7)return ['Yak','Dush','Sesh','Chor','Pay','Jum','Shan'][d.getDay()];return d.getDate()+'-'+MON[d.getMonth()]}
const lastOf=c=>c.msgs.length?c.msgs[c.msgs.length-1]:null;
function preview(c){const m=lastOf(c);let txt=m?(m.b?'':'Siz: ')+m.text:c.last;return {txt,res:c.res||0}}

function renderChips(){
  const keys=['all',...new Set(chats.map(c=>c.s))];
  $('#chips').innerHTML=keys.map(k=>k==='all'?`<button class="chip ${filter==='all'?'on':''}" data-f="all">Barchasi</button>`:
    `<button class="chip ${filter===k?'on':''}" data-f="${k}"><span class="d" style="background:${SUBJ[k].c}"></span>${SUBJ[k].n}</button>`).join('');
}
function itemHTML(c){const s=SUBJ[c.s],p=preview(c);
  return `<div class="item ${c.id===active?'on':''}" data-id="${c.id}" title="${esc(c.title)}">
    <span class="sic" style="background:${s.c}1C;color:${s.c}"><svg class="ic sm"><use href="#${s.i}"/></svg></span>
    <div class="t"><div class="r1">${renaming===c.id?`<input class="rn" value="${esc(c.title)}">`:`<b>${hl(c.title)}</b>`}${c.pin?'<svg class="ic xs pin"><use href="#i-pin"/></svg>':''}<time>${stamp(c.t)}</time></div>
    <small>${p.res?`<span class="att"><svg class="ic xs"><use href="#i-file"/></svg>${p.res}</span> · `:''}${hl(p.txt)}</small></div>
    <button class="more ${menuFor===c.id?'open':''}" data-more="${c.id}" title="Amallar"><svg class="ic sm"><use href="#i-dots"/></svg></button></div>`}
function renderList(){
  let list=chats.filter(c=>(filter==='all'||c.s===filter)&&(!q||c.title.toLowerCase().includes(q)||(preview(c).txt||'').toLowerCase().includes(q)));
  list.sort((a,b)=>b.t-a.t);
  $('#hCnt').textContent=chats.length;
  if(!list.length){$('#list').innerHTML=`<div class="empty-l"><div class="ei"><svg class="ic"><use href="#i-search"/></svg></div>${q?`“${esc(q)}” bo'yicha hech narsa topilmadi`:"Bu fan bo'yicha hali chat yo'q"}</div>`;return}
  const pins=list.filter(c=>c.pin),rest=list.filter(c=>!c.pin);let h='';
  if(pins.length&&!q)h+=`<div class="grp"><svg class="ic xs"><use href="#i-pin"/></svg>Qadalgan</div>`+pins.map(itemHTML).join('');
  let g='';(q?list:rest).forEach(c=>{const gg=grp(c.t);if(gg!==g){g=gg;h+=`<div class="grp">${g}</div>`}h+=itemHTML(c)});
  $('#list').innerHTML=h;
  const rn=$('#list input.rn');if(rn){rn.focus();rn.select()}
}
function fileIcon(k){
  if(k==='yt')return `<div class="ft yt"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="#fff"/></svg></div>`;
  const m={pdf:['PDF','#E5372B'],ppt:['PPT','#E5372B'],doc:['DOC','#1D5FE0']}[k];
  return `<div class="ft"><div class="pg"></div><span class="lb" style="background:${m[1]}">${m[0]}</span></div>`}
function renderChat(){
  const c=chats.find(x=>x.id===active),s=SUBJ[c?c.s:(filter!=='all'?filter:'fizika')];
  $('#cTitle').textContent=c?c.title:'Yangi chat';
  $('#cBadge').innerHTML=`<svg class="ic xs"><use href="#${s.i}"/></svg>${s.n}`;
  const msgs=c&&c.msgs.length?c.msgs:[{b:1,time:'',day:c?'':'Bugun',text:c?`“${c.title}” suhbati. Davom ettiramizmi?`:"Assalomu alaykum, Azizbek! Bugun siz bilan nimani o'rganamiz?",sugg:c?null:["Fizika: Nyuton qonunlari","Matematika: tenglamalar","Ingliz tili: Present Simple","Uy vazifamga yordam ber"]}];
  let h='',day='';
  msgs.forEach(m=>{
    if(m.day&&m.day!==day){day=m.day;h+=`<div class="day">${m.day}</div>`}
    if(m.typing){h+=`<div class="row"><div class="bot-ava"><svg class="ic"><use href="#i-spark"/></svg></div><div class="typing"><i></i><i></i><i></i></div></div>`;return}
    if(!m.b){h+=`<div class="row me"><div class="col"><div class="umsg">${esc(m.text)}</div><time>${m.time} ✓✓</time></div><div class="ava">A</div></div>`;return}
    h+=`<div class="row"><div class="bot-ava"><svg class="ic"><use href="#i-spark"/></svg></div><div class="bmsg">
      <div class="nm">Virtual metodist <span class="badge"><svg class="ic xs"><use href="#${s.i}"/></svg>${s.n}</span>${m.time?`<time>${m.time}</time>`:''}</div>
      <p>${esc(m.text)}</p>
      ${m.res?`<div class="res">${m.res.map(r=>`<div class="rc">${fileIcon(r.k)}<b title="${esc(r.t)}">${esc(r.t)}</b><span>${r.s}</span><button class="open">Ochish <svg class="ic xs"><use href="#i-ext"/></svg></button></div>`).join('')}</div>`:''}
      ${m.sugg?`<div class="sugg">${m.sugg.map(x=>`<button data-ask="${esc(x)}"><svg class="ic xs"><use href="#i-spark"/></svg>${esc(x)}</button>`).join('')}</div>`:''}
      ${m.res||m.long?`<div class="acts"><button><svg class="ic xs"><use href="#i-copy"/></svg>Nusxa</button><button><svg class="ic xs"><use href="#i-redo"/></svg>Qayta</button><button title="Foydali"><svg class="ic xs"><use href="#i-up"/></svg></button><button title="Foydali emas"><svg class="ic xs"><use href="#i-down"/></svg></button></div>`:''}
    </div></div>`});
  $('#thread').innerHTML=h;const sc=$('#scroll');sc.scrollTop=sc.scrollHeight;
}
function render(){renderChips();renderList();renderChat()}

/* actions */
const hhmm=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function ask(text){
  text=text.trim();if(!text)return;
  let c=chats.find(x=>x.id===active);
  if(!c){c={id:Date.now(),s:filter!=='all'?filter:'fizika',title:text.length>38?text.slice(0,38)+'…':text,t:Date.now(),msgs:[{b:1,time:hhmm(),day:'Bugun',text:"Assalomu alaykum, Azizbek! Bugun siz bilan nimani o'rganamiz?"}]};chats.push(c);active=c.id}
  c.msgs.push({b:0,time:hhmm(),text});c.msgs.push({b:1,typing:true});c.t=Date.now();
  $('#ta').value='';autosize();render();
  setTimeout(()=>{c.msgs.pop();c.msgs.push({b:1,time:hhmm(),text:`Zo'r savol! “${text}” mavzusi bo'yicha siz uchun mos resurslarni tanladim:`,res:RES.slice(0,2)});c.res=(c.res||0)+2;render()},1300);
}
function autosize(){const t=$('#ta');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px';$('#send').disabled=!t.value.trim()}
function toast(msg,undoFn){$('#tMsg').textContent=msg;$('#tUndo').style.display=undoFn?'':'none';undo=undoFn;const t=$('#toast');t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),4000)}
function closePop(){$('#pop').classList.remove('open');menuFor=null;document.querySelectorAll('.more.open').forEach(b=>b.classList.remove('open'))}
function del(id){const i=chats.findIndex(c=>c.id===id),c=chats[i];chats.splice(i,1);const wasActive=active===id;if(wasActive)active=null;render();
  toast(`“${c.title.length>28?c.title.slice(0,28)+'…':c.title}” o'chirildi`,()=>{chats.splice(i,0,c);if(wasActive)active=id;render()})}
const mobile=()=>matchMedia('(max-width:900px)').matches;
function setHist(open){$('#hist').classList.toggle('closed',!open);$('#hToggle').classList.toggle('on',open);$('#scrim').classList.toggle('on',open&&mobile())}

$('#ta').addEventListener('input',autosize);
$('#ta').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(e.target.value)}});
$('#send').onclick=()=>ask($('#ta').value);
$('#newChat').onclick=()=>{active=null;render();if(mobile())setHist(false);$('#ta').focus()};
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();$('#sBox').classList.toggle('has',!!q);renderList()};
$('#qClr').onclick=e=>{e.preventDefault();$('#q').value='';q='';$('#sBox').classList.remove('has');renderList()};
$('#hToggle').onclick=()=>setHist($('#hist').classList.contains('closed'));
$('#hClose').onclick=()=>setHist(false);
$('#scrim').onclick=()=>setHist(false);
$('#tUndo').onclick=()=>{undo&&undo();$('#toast').classList.remove('show')};
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#newChat').click()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='b'){e.preventDefault();$('#hToggle').click()}
  if(e.key==='Escape')closePop();
  if(e.target.classList.contains('rn')){if(e.key==='Enter')e.target.blur();if(e.key==='Escape'){renaming=null;render()}}
});
document.addEventListener('focusout',e=>{if(e.target.classList.contains('rn')){const c=chats.find(x=>x.id===renaming),v=e.target.value.trim();if(c&&v)c.title=v;renaming=null;render()}});
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;render();return}
  const mo=e.target.closest('[data-more]');
  if(mo){e.stopPropagation();const id=+mo.dataset.more;if(menuFor===id){closePop();return}closePop();menuFor=id;mo.classList.add('open');
    const r=mo.getBoundingClientRect(),p=$('#pop');p.querySelector('[data-act=pin] span').textContent=chats.find(c=>c.id===id).pin?'Qadashni bekor qilish':"Qadab qo'yish";
    p.classList.add('open');const top=Math.min(r.bottom+6,innerHeight-p.offsetHeight-10);p.style.top=top+'px';p.style.left=Math.max(10,r.right-p.offsetWidth)+'px';return}
  const act=e.target.closest('[data-act]');
  if(act){const a=act.dataset.act,id=a.endsWith('-cur')?active:menuFor,c=chats.find(x=>x.id===id);closePop();if(!c)return;
    if(a==='pin'){c.pin=!c.pin;render();toast(c.pin?'Chat qadab qo\'yildi':'Qadash bekor qilindi')}
    if(a.startsWith('rename')){renaming=id;if($('#hist').classList.contains('closed'))setHist(true);render()}
    if(a.startsWith('del'))del(id);
    if(a==='share')toast('Havola nusxalandi');return}
  if(!e.target.closest('#pop'))closePop();
  const it=e.target.closest('.item');if(it&&!e.target.closest('input')){active=+it.dataset.id;render();if(mobile())setHist(false);return}
  const as=e.target.closest('[data-ask]');if(as){ask(as.dataset.ask);return}
  const th=e.target.closest('[data-t]');if(th){document.documentElement.dataset.theme=th.dataset.t;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b===th))}
});
$('#list').addEventListener('scroll',closePop);
if(mobile())setHist(false);
matchMedia('(max-width:900px)').addEventListener('change',e=>setHist(!e.matches));
render();
</script>
</body></html>
